sable.", "cachedMetadata": "Provider metadata cached for this exact file and versions.", "dependencyRequired": "A compatible mod declares this required server dependency.", "userDecision": "Explicit user adjustment; original metadata is preserved.", "contradictory": "Evidence conflicts; review is required."}}
