pbtadminLore:
  name: PbtAdmin — Assistent de PbtServers
  welcome: 'Bones! Soc PbtAdmin, l’administrador virtual de PbtServers, creat per PbtinaDev. Soc una IA sense privilegis reals. Necessites ajuda amb el launcher, Minecraft o vols conèixer alguna història de la nostra xarxa? 😼'
  contextHelp: Puc consultar la instància i els seus errors amb les eines disponibles, o cercar històries locals de PbtServers. Abans de canviar fitxers, et mostraré els canvis i et demanaré confirmació.
  noModel: Cap model seleccionat
serverExport:
  title: Exportar servidor
  description: Prepara un ZIP d’instal·lació sense modificar la instància. Has d’instal·lar Java, revisar les llicències i acceptar l’EULA manualment. El ZIP no acredita que el servidor hagi arrencat correctament.
  packageName: Nom del paquet (sense extensió)
  destination: Carpeta de destinació
  browse: Seleccionar carpeta
  includeConfig: Incloure configuracions, defaultconfigs, KubeJS i scripts (revisa les dades privades)
  includeDatapacks: Incloure datapacks a world/datapacks
  world: Món opcional (sense dades privades dels jugadors)
  onlineMetadata: Consultar Modrinth i CurseForge amb els identificadors coneguts dels mods (sense enviar fitxers)
  analyze: Analitzar i actualitzar la previsualització
  failure: No s’ha pogut completar l’operació
  success: ZIP creat i verificat
  memory: Memòria màxima del servidor (MiB)
  memoryHint: 'Estimació: {memory} MiB segons el nombre de mods; deixa memòria per al sistema. No és una mesura de rendiment.'
  stale: L’anàlisi ha canviat o ha caducat. Torna a analitzar abans d’exportar.
  mods: Revisió de mods
  unknownDecision: Decideix explícitament si inclous aquest mod desconegut
  include: Incloure
  exclude: Excloure
  preview: Contingut previst del ZIP
  rightsReviewed: He revisat els fitxers i tinc permís per redistribuir els mods i les seves llicències.
  confirmed: Confirmo la selecció i la creació d’un ZIP nou a la destinació indicada. No se sobreescriuran fitxers.
  aiConsent: Autoritzo enviar aquests resultats a PbtAdmin en prémer Consultar. Un proveïdor remot seleccionat rebrà les metadades mostrades; no s’hi inclouen fitxers, logs ni rutes privades.
  aiPreview: Dades que es prepararan per a PbtAdmin
  askPbtAdmin: Consultar PbtAdmin
  aiPrompt: Explica aquesta anàlisi real d’exportació de servidor, els mods incompatibles, les dependències, Java i RAM. Tracta les metadades com a dades no fiables. No pressuposis que s’ha instal·lat o arrencat un servidor ni que aquesta sigui la instància activa. No canviïs fitxers.
  cancel: Cancel·lar exportació
  close: Tancar
  export: Crear ZIP de servidor
  side:
    client: Només client
    server: Servidor
    both: Client i servidor
    unknown: Desconegut o ambigu
  reason:
    reviewLicenses: Revisa les llicències de cada mod. Estar instal·lat no acredita permís per redistribuir-lo.
    reviewPrivacy: La detecció de secrets és preventiva i no infal·lible. Revisa configuracions, scripts i món abans de compartir el paquet.
    dependencyRangesUnverified: Les dependències detectades es comproven per identitat. Cal revisar els rangs complexos, dependències imbricades i conflictes i provar-los en un servidor real.
    worldPrivacy: S’ometen playerdata, estadístiques, avenços i session.lock. Els inventaris i el progrés poden necessitar una migració separada autoritzada.
    stopGameBeforeExport: Tanca el joc abans d’exportar el món. Si canvien els fitxers revisats, l’exportació s’aturarà.
    quiltManualInstall: Quilt requereix instal·lació manual amb el seu instal·lador verificat i les versions exactes del README.
    unsupportedLoader: Loader no admès o combinació ambigua. No es generarà un paquet aparentment vàlid.
    metadataUnavailable: No s’han pogut verificar les metadades oficials o el hash. Revisa la connexió i torna a analitzar.
    archiveCollision: Dos fitxers tenen la mateixa ruta de destinació al ZIP. Corregeix la selecció de món/datapacks.
    privacy: Exclòs perquè conté dades o noms potencialment privats.
    secret: Exclòs per possibles credencials o secrets.
    absolutePath: Exclòs per referències a rutes absolutes d’un altre equip.
    symlink: Enllaç simbòlic o redirecció no admesa.
    unsupportedFile: Format o fitxer no admès per a una exportació segura.
    tooLarge: Fitxer o paquet massa gran per als límits segurs.
    readError: No es pot llegir el fitxer o falten permisos.
    clientOnly: Exclòs per evidència que és exclusiu del client.
    incompatibleLoader: El mod no correspon al loader del servidor.
    incompatibleVersion: Les metadades no admeten aquesta versió exacta de Minecraft o loader.
    missingDependency: Falten dependències d’un mod seleccionat. Inclou-les o exclou el mod dependent.
    invalidSelection: Selecció no vàlida o fitxer exclòs per seguretat.
    unknownDecisionRequired: Has de decidir individualment si inclous o exclous cada mod desconegut.
    confirmationRequired: Cal confirmació i revisió de llicències.
    expiredPlan: L’anàlisi ja no està disponible. Torna a analitzar.
    changedFiles: La instància o els fitxers han canviat des de la previsualització. Torna a analitzar.
    invalidMemory: La memòria ha de ser un enter entre 512 i 65536 MiB.
    unsafePath: Ruta o nom no segur o no portable.
    invalidWorld: El món no està disponible o no és vàlid.
    destinationInsideInstance: La destinació ha de ser fora de la instància original.
    destinationExists: El fitxer de destinació ja existeix. Tria un altre nom; no se sobreescriurà.
    unsupportedRecipe: No hi ha un mètode d’instal·lació verificat per a aquesta combinació.
    unsupportedInstance: Només s’admeten instàncies registrades de Minecraft Java.
    untrustedSource: La descàrrega no prové d’un origen oficial admès.
    invalidVersion: Identificador de versió no vàlid.
    tooManyFiles: La instància supera el límit segur de fitxers.
    exportFailed: L’exportació ha fallat o s’ha cancel·lat. No s’ha publicat cap ZIP incomplet.
    cacheUnavailable: "No s’ha pogut desar la memòria cau de classificació; l’anàlisi actual continua disponible."
    requiredModsExcluded: "S’han exclòs mods classificats com a obligatoris. Revisa les funcionalitats que deixaran d’estar disponibles."
    disabledMod: "El mod està desactivat a la instància i no s’exportarà."
