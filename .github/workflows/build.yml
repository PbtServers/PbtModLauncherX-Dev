name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - 'xmcl-runtime/**'
      - 'xmcl-runtime-api/**'
      - 'xmcl-keystone-ui/**'
      - 'xmcl-electron-app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release (ej: v1.0.6). Si vacío y no es push tag, usa v0.0.0-dev"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Python (node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fix node-gyp tooling
        run: python -m pip install --upgrade pip packaging setuptools
        shell: bash

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install (retry)
        shell: bash
        run: |
          n=0
          until [ $n -ge 3 ]
          do
            pnpm install --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000 && break
            n=$((n+1))
            echo "retry $n..."
            sleep 10
          done
          [ $n -lt 3 ]

      - name: Build
        run: |
          pnpm run --prefix xmcl-keystone-ui build
          pnpm run --prefix xmcl-electron-app build:all
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NODE_ENV: production
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
        shell: bash

      - name: Upload Source Maps
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: sourcemap
          path: |
            xmcl-electron-app/dist/*.js.map
          if-no-files-found: warn

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: xmcl-electron-app/build/output/
          if-no-files-found: warn

      - name: Upload Windows unpacked
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: win-b${{ github.run_number }}
          path: xmcl-electron-app/build/output/win-unpacked/
          if-no-files-found: warn

      - name: Upload Linux x64 unpacked
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-b${{ github.run_number }}-x64
          path: xmcl-electron-app/build/output/linux-unpacked/
          if-no-files-found: warn

      - name: Upload Linux arm64 unpacked
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-b${{ github.run_number }}-arm64
          path: xmcl-electron-app/build/output/linux-arm64-unpacked/
          if-no-files-found: warn

      - name: Upload Mac x64 unpacked
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-b${{ github.run_number }}-x64
          path: xmcl-electron-app/build/output/mac/
          if-no-files-found: warn

      - name: Upload Mac arm64 unpacked
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-b${{ github.run_number }}-arm64
          path: xmcl-electron-app/build/output/mac-arm64/
          if-no-files-found: warn

  release:
    name: Draft Release (tag only)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: build

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=v0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd build
          # sha256sum no está en mac/windows pero aquí estamos en ubuntu
          find . -maxdepth 1 -type f -print0 | xargs -0 -I{} sha256sum "{}" > SHA256SUMS.txt || true

      - name: Build release body
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.name }}"
          cat > RELEASE_BODY.md << EOF
          ## **PbtModLauncherX [Versión ${VERSION#v}] -->**

          ### *Esta versión incluye:*
          - Build multiplataforma automática (Windows, macOS y Linux).
          - Artefactos adjuntos generados por GitHub Actions.
          - Archivo de checksums SHA256.

          ### *Aún por añadir:*
          - Ajustes menores y mejoras según feedback de usuarios.
          EOF

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          draft: true
          prerelease: false
          body_path: RELEASE_BODY.md
          files: |
            build/*
            build/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
