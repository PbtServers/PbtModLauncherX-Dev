name: Build & Release
on:
  push:
    branches:
      - master
      - phase2/packaging-validation
    tags:
      - v*
    paths:
      - xmcl-runtime/**
      - xmcl-runtime-api/**
      - xmcl-keystone-ui/**
      - xmcl-electron-app/**
      - package.json
      - pnpm-lock.yaml
      - .github/**
      - deskgap-app/**
      - packages/**
      - pnpm-workspace.yaml
      - xmcl-client-vue/**
      - patches/**
      - scripts/**
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de una release en borrador; vacío solo compila"
        required: false
        default: ""
      prepare_draft:
        description: "Adjuntar los paquetes a un borrador existente, sin publicarlo"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  prepare-macos-x64-ollama:
    name: Prepare verified Ollama Intel runtime on ARM
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prepare Intel Ollama runtime on ARM
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm exec tsx scripts/prepare-ollama.mjs --version v0.34.0 --platform darwin --arch x64
          tar -czf mac-x64-ollama-runtime.tar.gz -C xmcl-electron-app/build/ollama mac-x64
      - name: Upload verified Intel Ollama runtime
        uses: actions/upload-artifact@v6
        with:
          name: ollama-macos-x64-runtime
          path: mac-x64-ollama-runtime.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    needs: prepare-macos-x64-ollama
    runs-on: ${{ matrix.os == 'macos-latest' && matrix.package_arch == 'x64' && 'macos-15-intel' || matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            package_arch: x64
          - os: ubuntu-24.04-arm
            package_arch: arm64
          - os: macos-latest
            package_arch: x64
          - os: macos-latest
            package_arch: arm64
          - os: windows-latest
            package_arch: x64
      fail-fast: false
    env:
      PBT_PACKAGE_ARCH: ${{ matrix.package_arch }}
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - name: Fix node-gyp and Python
        if: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
        run: python3 -m pip install --break-system-packages --user packaging setuptools
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-${{ matrix.package_arch }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache Vite deps
        uses: actions/cache@v5
        with:
          path: xmcl-keystone-ui/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('pnpm-lock.yaml', 'xmcl-keystone-ui/vite.config.ts') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Setup Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools zstd rpm
          # Hosted runner toolchains unused by this build; preserve workspace/data.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Download preverified macOS Intel runtime
        if: ${{ runner.os == 'macOS' && matrix.package_arch == 'x64' }}
        uses: actions/download-artifact@v4
        with:
          name: ollama-macos-x64-runtime
          path: .ollama-intel-artifact
      - name: Restore verified Intel runtime
        if: ${{ runner.os == 'macOS' && matrix.package_arch == 'x64' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xmcl-electron-app/build/ollama
          tar -xzf .ollama-intel-artifact/mac-x64-ollama-runtime.tar.gz -C xmcl-electron-app/build/ollama
      - name: Prepare verified Ollama runtimes without model weights
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/ci-ollama.ts
      - name: Verify all AI resources before packaging
        run: pnpm exec tsx scripts/ci-ollama.ts --verify-only
      - name: Check package validator module loading
        run: pnpm exec tsx scripts/verify-linux-package-content.mjs --check-imports
      - name: Run packaging and updater regression tests
        run: pnpm exec vitest run scripts/ci-ollama.test.ts scripts/release-assets.test.ts scripts/verify-release-packages.test.ts scripts/collect-release-assets.test.ts xmcl-electron-app/build/verifyPackedResources.test.ts xmcl-electron-app/build/deduplicateRuntime.test.ts xmcl-electron-app/build/ollamaPackaging.test.ts xmcl-electron-app/build/releaseMetadata.test.ts xmcl-electron-app/main/utils/updater.test.ts xmcl-electron-app/main/utils/updateDownload.test.ts xmcl-runtime/agent/runtimeBundle.test.ts xmcl-runtime/agent/managedOllama.test.ts xmcl-keystone-ui/src/composables/agent/qwenInstaller.test.ts xmcl-keystone-ui/src/util/customLauncherNews.test.ts xmcl-keystone-ui/src/util/newsTranslation.test.ts xmcl-keystone-ui/src/util/locale.test.ts xmcl-runtime-api/src/entities/locale.test.ts xmcl-runtime/user/UserService.persistence.test.ts xmcl-runtime/user/UserPersistence.test.ts xmcl-keystone-ui/src/composables/user.test.ts xmcl-runtime/app/BaseService.update.test.ts xmcl-electron-app/main/pluginAutoUpdate.test.ts xmcl-runtime/agent/AgentService.test.ts xmcl-runtime/agent/ollama.test.ts xmcl-keystone-ui/src/util/launcherReleaseNews.test.ts xmcl-keystone-ui/src/util/newsCache.test.ts xmcl-keystone-ui/src/util/newsImage.test.ts xmcl-electron-app/main/portableData.test.ts
      - name: Type check and lint
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm check
          pnpm lint
      - name: Check available packaging space
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          df -h .
          du -sh xmcl-electron-app/build/ollama/* 2>/dev/null || true
      - name: Build
        shell: bash
        run: |
          pnpm run --prefix xmcl-keystone-ui build
          pnpm run --prefix xmcl-electron-app build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NODE_OPTIONS: --max-old-space-size=8192
          NODE_ENV: production
          RELEASE: 'true'
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PUBLISHER: ${{ vars.CODE_SIGN_PUBLISHER }}
      - name: Resolve pinned DeskGap runtime
        if: ${{ runner.os == 'Windows' }}
        id: deskgap
        shell: pwsh
        run: |
          $version = (Get-Content deskgap-app\package.json -Raw | ConvertFrom-Json).config.deskgapVersion
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Pin an exact published DeskGap version in deskgap-app/package.json' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Checkout matching DeskGap packaging helpers
        if: ${{ runner.os == 'Windows' }}
        uses: actions/checkout@v5
        with:
          repository: Voxelum/DeskGap
          ref: v${{ steps.deskgap.outputs.version }}
          path: deskgap-runtime-source
          persist-credentials: false
      - name: Use Node.js 24 for DeskGap packaging
        if: ${{ runner.os == 'Windows' }}
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install DeskGap packaging helpers
        if: ${{ runner.os == 'Windows' }}
        working-directory: deskgap-runtime-source
        run: npm ci
      - name: Download pinned DeskGap Windows runtime
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          DESKGAP_VERSION: ${{ steps.deskgap.outputs.version }}
        run: |
          $name = "deskgap-v$env:DESKGAP_VERSION-win32-x64.zip"
          $base = "https://github.com/Voxelum/DeskGap/releases/download/v$env:DESKGAP_VERSION"
          $directory = 'deskgap-app\build\runtime'
          New-Item -ItemType Directory -Force $directory | Out-Null
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile "$directory\SHA256SUMS"
          $pattern = '^([a-fA-F0-9]{64})\s+\*?' + [regex]::Escape($name) + '$'
          $entries = @(Get-Content "$directory\SHA256SUMS" | Where-Object { $_ -match $pattern })
          if ($entries.Count -ne 1) { throw "Expected exactly one checksum for $name in the pinned runtime release" }
          $expected = [regex]::Match($entries[0], $pattern).Groups[1].Value
          Invoke-WebRequest "$base/$name" -OutFile "$directory\$name"
          if ((Get-FileHash "$directory\$name" -Algorithm SHA256).Hash -ne $expected) { throw 'DeskGap runtime checksum mismatch' }
          Expand-Archive "$directory\$name" "$directory\extracted"
      - name: Build DeskGap single EXE alongside Electron
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
          DESKGAP_VERSION: ${{ steps.deskgap.outputs.version }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'deskgap-runtime-source'
          $extracted = Join-Path $env:GITHUB_WORKSPACE 'deskgap-app\build\runtime\extracted'
          $runtime = Join-Path $extracted 'DeskGap'
          $bootstrap = Join-Path $extracted "DeskGapBootstrap-v$env:DESKGAP_VERSION-win32-x64.exe"
          pnpm --prefix=deskgap-app package "$source" "$runtime" "$bootstrap"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item "deskgap-app\build\output\release\pbtmodlauncherx-deskgap-$version-win32-x64.exe" xmcl-electron-app\build\output\
      - name: Upload Source Maps
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: sourcemap
          overwrite: true
          path: |
            xmcl-electron-app/dist/*.js.map
            xmcl-electron-app/dist/renderer/assets/*.js.map
      - name: Verify complete packages and write checksums
        run: node scripts/verify-release-packages.mjs xmcl-electron-app/build/output ${{ runner.os }} ${{ matrix.package_arch }}
      - name: Extract and verify every Linux package
        if: ${{ runner.os == 'Linux' }}
        run: pnpm exec tsx scripts/verify-linux-package-content.mjs xmcl-electron-app/build/output ${{ matrix.package_arch }}
      - name: Upload Build
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ runner.os }}-${{ matrix.package_arch }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          path: |
            xmcl-electron-app/build/output/*.*
      - name: Upload Windows Zip Build
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: win-b${{ github.run_number }}
          overwrite: true
          compression-level: 0
          path: |
            xmcl-electron-app/build/output/win-unpacked/
      - name: Upload Linux x64 Zip Build
        if: ${{ runner.os == 'Linux' && matrix.package_arch == 'x64' }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-b${{ github.run_number }}-${{ matrix.package_arch }}-x64
          overwrite: true
          compression-level: 0
          path: |
            xmcl-electron-app/build/output/linux-unpacked/
      - name: Upload Linux arm64 Zip Build
        if: ${{ runner.os == 'Linux' && matrix.package_arch == 'arm64' }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-b${{ github.run_number }}-${{ matrix.package_arch }}-arm64
          overwrite: true
          compression-level: 0
          path: |
            xmcl-electron-app/build/output/linux-arm64-unpacked/
  release:
    name: Prepare reviewed draft assets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.prepare_draft && inputs.tag != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Reserve space for bundled AI release assets
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
          available=$(df -Pk . | awk 'NR==2 {print $4}')
          test "$available" -ge 41943040 || { echo 'At least 40 GiB required to download and split release artifacts'; exit 1; }
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: false
          path: build
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24 for release validation
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install validation dependencies
        run: pnpm install --frozen-lockfile
      - name: Attach verified artifacts without editing release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          node scripts/collect-release-assets.mjs build
          node scripts/release-assets.mjs build/release
          # Never replace published assets or edit release notes. Name collisions fail.
          gh release upload "$RELEASE_TAG" build/release/* --repo "$GITHUB_REPOSITORY"
